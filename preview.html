  --indigo: #5B54E8;

}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #e7e7e7;
  color: var(--offwhite);
  font-family: var(--font-en);
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
}

.toolbar {
  width: min(100%, 440px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 8px 0 12px;
  flex-shrink: 0;
}

.brand-mini {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.brand-mini span { color: var(--coral); }

#replay {
  background: var(--coral);
  color: var(--navy);
  border: 0;
  border-radius: 999px;
  padding: 11px 20px;
  font: 800 13px var(--font-en);
  cursor: pointer;
}

#replay:focus-visible {
  outline: 3px solid var(--offwhite);
  outline-offset: 3px;
}

.stage-shell {
  width: min(calc(100vw - 32px), calc((100vh - 120px) * 0.5625));
  width: min(440px, calc(100vw - 32px), calc((100vh - 120px) * 0.5625));
  aspect-ratio: 9 / 16;
  position: relative;
  overflow: hidden;
  background: var(--navy);
  box-shadow: 0 18px 70px #0007;
  flex-shrink: 0;
}

#stage {
  position: absolute;
  left: 0;
  top: 0;
  width: 1080px;
  height: 1920px;
  transform-origin: top left;
  overflow: hidden;
  background: var(--navy);
  color: var(--offwhite);
}

.scene {
  position: absolute;
  inset: 0;
  overflow: hidden;
  visibility: hidden;
}

.scene.dark { background: var(--navy); }
.scene.light { background: var(--offwhite); color: var(--navy); }

.scene-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.eyebrow {
  position: absolute;
  top: 180px;
  left: 100px;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 5px;
  text-transform: uppercase;
}

.dark .eyebrow { color: var(--offwhite); }
.light .eyebrow { color: var(--navy); }

.eyebrow .accent { color: var(--coral); }

.caption {
  position: absolute;
  left: 90px;
  width: 900px;
  top: 1290px;
  font-family: var(--font-ml);
  font-weight: 700;
  font-size: 68px;
  line-height: 1.55;
  letter-spacing: 0;
  white-space: normal;
  overflow-wrap: normal;
  word-break: normal;
  z-index: 20;
}

.caption.center { text-align: center; }

.caption .word {
  display: inline;
  margin-right: 0.20em;
  color: inherit;
  transition: color 0.12s;
}

.dark .caption { color: var(--offwhite); }
.light .caption { color: var(--navy); }
.caption .key { color: var(--coral); }

.caption-intro {
  position: absolute;
  top: 1220px;
  left: 90px;
  width: 900px;

}

.en {

#stage svg { overflow: visible; }

.phone {

  height: 800px;

  border-radius: 66px;
  background: transparent;
  padding: 25px;
}

.phone-notch {

  width: 130px;
  height: 20px;
  top: 15px;
  left: 153px;

}

.post {

  height: 510px;

}

.avatar {

.post-name {

  width: 180px;
  height: 180px;
  background: var(--coral);
  border-radius: 50%;
  right: -30px;
  top: -20px;
}

.post-art::after {
  content: "";
  position: absolute;
  width: 200px;
  height: 70px;
  background: var(--offwhite);
  transform: rotate(-35deg);
  left: -30px;
  bottom: 35px;
}

.post-stats {
  font-size: 24px;
  font-weight: 800;
  margin-top: 20px;
}

.view-counter {
  position: absolute;
  left: 650px;
  top: 1040px;
  background: var(--coral);
  color: var(--navy);
  padding: 20px 28px;
  border-radius: 18px;
  font: 900 37px var(--font-en);
  opacity: 0;
}

.decor-ring {
  position: absolute;
  border: 4px solid var(--indigo);
  border-radius: 50%;
  opacity: .7;
}

.ring-one { width: 180px; height: 180px; right: 65px; top: 350px; }
.ring-two { width: 100px; height: 100px; left: 80px; top: 820px; }

.chart-wrap {

  left: 95px;
  top: 490px;
  width: 890px;
  height: 470px;
}

.calendar {
  position: absolute;
  left: 350px;
  top: 1020px;
  display: flex;
  gap: 18px;
}

.day {
  width: 95px;
  height: 115px;
  border: 4px solid var(--indigo);
  border-radius: 16px;
  color: var(--navy);

  font-weight: 800;
  text-align: center;
  padding-top: 30px;
  opacity: .35;
}

.day.active {
  background: var(--indigo);
  color: var(--offwhite);
  opacity: 1;
}

.countdown {
  position: absolute;
  top: 390px;
  left: 0;
  width: 1080px;
  text-align: center;
  font: 900 370px/.95 var(--font-en);
  color: var(--coral);
}

.countdown span {
  position: absolute;
  inset: 0;
  opacity: 0;
}

.swipe-card {
  position: absolute;
  left: 300px;
  top: 840px;
  width: 480px;
  height: 230px;
  border-radius: 28px;
  background: var(--indigo);
  display: flex;
  align-items: center;
  justify-content: center;
  font: 900 46px var(--font-en);
  opacity: 0;
}

.swipe-thumb {

  width: 105px;
  height: 145px;
  left: 720px;
  top: 930px;
  font-size: 110px;
  opacity: 0;

}

.steps-svg {

  top: 350px;
  width: 1080px;
  height: 700px;
}

.step-card {

.step-number {

.step-icon {

  color: var(--coral);

}

.step-copy {

.step-copy .step-label { color: var(--coral); }

.step-caption {

  text-align: center;
  color: var(--offwhite);
}

.logo-mark {

.logo-symbol {

.logo-symbol span {

}

.logo-name {

  letter-spacing: -4px;
}

.logo-name .attention { color: var(--offwhite); }
.logo-name .draft { color: var(--coral); }

.tagline {
  position: absolute;
  left: 110px;
  top: 900px;
  width: 860px;
  text-align: center;
  font: 600 45px/1.55 var(--font-en);
  color: var(--offwhite);
  opacity: 0;
  transform: translateY(35px);
}

.follow-button {
  position: absolute;
  left: 150px;
  top: 1280px;
  width: 780px;
  min-height: 130px;
  border: 5px solid var(--coral);
  border-radius: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--coral);
  font: 800 49px var(--font-en);
  opacity: 0;
}

.final-caption {
  position: absolute;
  top: 175px;
  left: 90px;
  width: 900px;
  font: 700 65px/1.55 var(--font-ml);
  text-align: center;
}

.whoosh {
  position: absolute;
  z-index: 100;
  left: -100px;
  top: 700px;
  width: 1280px;
  height: 500px;
  background: var(--offwhite);

  transform-origin: left center;
  pointer-events: none;
}

.progress-shell {
  width: min(100%, 440px);

}

.progress-track {
  width: 100%;
  height: 5px;
  border-radius: 5px;
  background: #ffffff26;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--coral);
  transform-origin: left;
}

.time-row {
  display: flex;
  justify-content: space-between;

}
.logo-mark {
  position: absolute;

  transform: scale(.65);

}

.brand-logo-image {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  /* Preserve the logo's original white background. */
  background: #FCFCFB;
}

@media (max-height: 650px) {
  body { padding: 6px; }
  .toolbar { padding: 3px 0 6px; }
}
</style>

/* =========================================================

   Canvas: 1080 x 1920, intended delivery: 30 fps.

const CONFIG = {

const stage = document.getElementById("stage");

/* ---------------------------------------------------------
   Safe text rendering. Malayalam is split ONLY at whitespace,
   never into individual characters or grapheme fragments.
   --------------------------------------------------------- */
function setCaption(elementId, text, highlightWords = []) {
  const el = document.getElementById(elementId);
  el.replaceChildren();

  const words = text.split(/(\s+)/);
  words.forEach(part => {
    if (/^\s+$/.test(part)) {
      el.appendChild(document.createTextNode(part));
      return;
    }

    const span = document.createElement("span");
    span.className = "word";
    span.textContent = part;

    const normalized = part.replace(/[.,!?;:।]/g, "");
    if (highlightWords.includes(normalized)) {
      span.classList.add("key");
      span.dataset.key = "true";
    }
    el.appendChild(span);
  });
}

   Exactly one master timeline controls the complete animation.
   Child tweens are added to it at absolute scene times.

const master = gsap.timeline({
  paused: true,
  defaults: { ease: CONFIG.motion.ease }
});

/* Scene-transition whoosh: a short visual flash and sweep. */
function addWhoosh(time) {
  master.set("#whoosh", {
    autoAlpha: 0.9,
    scaleX: 0,
    filter: "blur(0px)"
  }, time);

  master.to("#whoosh", {
    scaleX: 1,
    duration: CONFIG.motion.sceneFlash,
    ease: "power3.out"
  }, time);

  master.to("#whoosh", {
    autoAlpha: 0,
    scaleX: 1.08,
    filter: "blur(18px)",
    duration: 0.22,
    ease: "power2.in"
  }, time + 0.12);
}

function enterScene(id, time) {
  master.set(".scene", { autoAlpha: 0 }, time);
  master.set(id, { autoAlpha: 1 }, time);
  master.fromTo(id, {
    scale: 1.015,
    filter: "blur(5px)"
  }, {
    scale: 1,
    filter: "blur(0px)",
    duration: 0.42,
    ease: "power3.out"
  }, time);
  addWhoosh(time);
}

function revealCaption(id, time, duration = 0.5) {
  const el = document.getElementById(id);
  master.fromTo(el, {
    autoAlpha: 0,
    y: 55
  }, {
    autoAlpha: 1,
    y: 0,
    duration,
    ease: "power3.out"
  }, time);
}

/* Keep each exact Malayalam script line visible while its card is active. */
function captionWords(text, highlights) {
  const container = document.createElement("span");
  text.split(/(\s+)/).forEach(part => {
    if (/^\s+$/.test(part)) {
      container.appendChild(document.createTextNode(part));
    } else {
      const span = document.createElement("span");
      span.className = "word";
      span.textContent = part;
      if (highlights.includes(part.replace(/[.,!?;:।]/g, ""))) {
        span.classList.add("key");
      }
      container.appendChild(span);
    }
  });
  return container;
}

  el.replaceChildren(captionWords(CONFIG.text.step1, CONFIG.highlights.step1));

/* ---------------------------------------------------------
   Recording UI: outside the stage, so it is not in the video.
   --------------------------------------------------------- */
const progressFill = document.getElementById("progressFill");
const timeCurrent = document.getElementById("timeCurrent");

function formatTime(seconds) {
  const s = Math.max(0, Math.min(CONFIG.duration, seconds));
  const whole = Math.floor(s);
  return `00:${String(whole).padStart(2, "0")}`;
}

master.eventCallback("onUpdate", () => {
  const t = master.time();
  progressFill.style.width = `${(t / CONFIG.duration) * 100}%`;
  timeCurrent.textContent = formatTime(t);
});

master.eventCallback("onComplete", () => {
  progressFill.style.width = "100%";
  timeCurrent.textContent = "00:42";
});

document.getElementById("replay").addEventListener("click", () => {
  master.restart();
});

/* Wait for Google Fonts before playing so Malayalam never flashes
   in a fallback font. The timeline itself remains the single master. */
// Wait 2 minutes before automatic playback
document.fonts.ready.then(() => {
  fit();
  tl.pause(0);

  setTimeout(() => {
    tl.play(0);
  }, 120000); // 120,000 ms = 2 minutes
});
